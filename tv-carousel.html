<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display Auto-Carousel | Aveam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0; padding: 0; background: #000; overflow: hidden;">

  <!-- TOP PROGRESS BAR -->
  <div class="carousel-progress-bar" id="carouselProgress"></div>

  <!-- FLOATING TV BADGE -->
  <div class="carousel-badge">
    <span style="font-size: 1.1rem;">📺</span>
    <span id="carouselBadgeLabel">TV Display Auto-Rotation</span>
  </div>

  <!-- CAROUSEL VIEWPORT WITH 2 IFRAMES -->
  <div class="carousel-viewport">
    
    <!-- FRAME 0: ASSEMBLY PROGRESS DAILY REPORT -->
    <iframe 
      id="frameDailyReport" 
      class="carousel-frame active" 
      src="about:blank"
      title="Assembly Progress Daily Report">
    </iframe>

    <!-- FRAME 1: Z-LINK REALTIME DASHBOARD -->
    <iframe 
      id="frameZLink" 
      class="carousel-frame" 
      src="index.html" 
      title="Z-Link Realtime Dashboard">
    </iframe>

  </div>

  <!-- JAVASCRIPT SCRIPTS -->
  <script src="js/tv-carousel.js"></script>

  <script>
    // Demo fallback for Frame 0 (Daily Report)
    document.addEventListener('DOMContentLoaded', () => {
      const frameDaily = document.getElementById('frameDailyReport');
      if (frameDaily) {
        // Create an attractive fallback/demo view for the Assembly Progress Daily Report if external URL is pending
        const htmlContent = `
          <!DOCTYPE html>
          <html lang="th">
          <head>
            <meta charset="UTF-8">
            <style>
              body {
                background: #0b1329;
                color: #ffffff;
                font-family: 'Outfit', 'Prompt', sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
              }
              .card {
                background: rgba(30, 41, 59, 0.8);
                border: 1px solid rgba(255,255,255,0.1);
                padding: 3rem;
                border-radius: 24px;
                text-align: center;
                box-shadow: 0 20px 50px rgba(0,0,0,0.5);
                max-width: 700px;
              }
              h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 0.5rem; }
              p { color: #94a3b8; font-size: 1.1rem; }
              .badge { background: #0284c7; padding: 0.5rem 1.2rem; border-radius: 20px; font-weight: 700; display: inline-block; margin-top: 1rem; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>📊 ASSEMBLY PROGRESS DAILY REPORT</h1>
              <p>หน้าแสดงรายงานสรุปความคืบหน้าการประกอบประจำวัน (Daily Report)</p>
              <div class="badge">ระบบกำลังวนสลับหน้าจอ (Auto-Carousel)</div>
              <p style="font-size: 0.9rem; margin-top: 1.5rem; color: #64748b;">* เมื่อใช้งานจริง สามารถนำ URL ของ Daily Report บน GitHub มาใส่ใน iframe ได้ทันที</p>
            </div>
          </body>
          </html>
        `;
        frameDaily.srcdoc = htmlContent;
      }
    });
  </script>
</body>
</html>
