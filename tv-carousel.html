<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display Auto-Carousel | Aveam</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1329;
      overflow: hidden;
      font-family: 'Outfit', 'Prompt', sans-serif;
    }
    .carousel-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1329;
      z-index: 1;
      overflow: hidden;
    }
    .carousel-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      z-index: 2;
    }
    .carousel-frame.active {
      display: block !important;
      z-index: 10;
    }
    .carousel-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 5px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      width: 0%;
      z-index: 9999;
      transition: width 0.2s linear;
    }
    .carousel-badge {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 1.1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- TOP PROGRESS BAR -->
  <div class="carousel-progress-bar" id="carouselProgress"></div>

  <!-- FLOATING TV BADGE -->
  <div class="carousel-badge">
    <span style="font-size: 1.1rem;">📺</span>
    <span id="carouselBadgeLabel">TV Display Auto-Rotation (กำลังโหลด...)</span>
  </div>

  <!-- CAROUSEL VIEWPORT WITH 2 IFRAMES -->
  <div class="carousel-viewport">
    
    <!-- FRAME 0: ASSEMBLY PROGRESS DAILY REPORT -->
    <iframe 
      id="frameDailyReport" 
      class="carousel-frame active" 
      src="https://niranam999.github.io/aveam-daily-assembly-dashboard/dashboard.html"
      title="Assembly Progress Daily Report">
    </iframe>

    <!-- FRAME 1: Z-LINK REALTIME DASHBOARD -->
    <iframe 
      id="frameZLink" 
      class="carousel-frame" 
      src="index.html" 
      title="Z-Link Realtime Dashboard">
    </iframe>

  </div>

  <!-- JAVASCRIPT SCRIPTS -->
  <script src="js/tv-carousel.js"></script>
</body>
</html>
