<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display Auto-Carousel | Aveam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0; padding: 0; background: #000; overflow: hidden;">

  <!-- TOP PROGRESS BAR -->
  <div class="carousel-progress-bar" id="carouselProgress"></div>

  <!-- FLOATING TV BADGE -->
  <div class="carousel-badge">
    <span style="font-size: 1.1rem;">📺</span>
    <span id="carouselBadgeLabel">TV Display Auto-Rotation</span>
  </div>

  <!-- CAROUSEL VIEWPORT WITH 2 IFRAMES -->
  <div class="carousel-viewport">
    
    <!-- FRAME 0: ASSEMBLY PROGRESS DAILY REPORT -->
    <iframe 
      id="frameDailyReport" 
      class="carousel-frame active" 
      src="https://niranam999.github.io/aveam-daily-assembly-dashboard/dashboard.html"
      title="Assembly Progress Daily Report">
    </iframe>

    <!-- FRAME 1: Z-LINK REALTIME DASHBOARD -->
    <iframe 
      id="frameZLink" 
      class="carousel-frame" 
      src="index.html" 
      title="Z-Link Realtime Dashboard">
    </iframe>

  </div>

  <!-- JAVASCRIPT SCRIPTS -->
  <script src="js/tv-carousel.js"></script>
</body>
</html>
