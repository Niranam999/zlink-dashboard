<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display Auto-Carousel | Aveam</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1329;
      overflow: hidden;
      font-family: 'Outfit', 'Prompt', sans-serif;
    }
    .carousel-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1329;
      z-index: 1;
      overflow: hidden;
    }
    .carousel-viewport-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transition: transform 0.1s ease-out;
    }
    .carousel-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: none;
      display: none;
      z-index: 2;
    }
    .carousel-frame.active {
      display: block !important;
      z-index: 10;
    }
    .carousel-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 5px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      width: 0%;
      z-index: 9999;
      transition: width 0.2s linear;
    }
    .carousel-badge {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- TOP PROGRESS BAR -->
  <div class="carousel-progress-bar" id="carouselProgress"></div>

  <!-- CAROUSEL VIEWPORT WITH DYNAMIC SCALER FOR TV RESOLUTIONS -->
  <div class="carousel-viewport">
    <div class="carousel-viewport-scaler" id="carouselScaler">
      
      <!-- FRAME 0: ASSEMBLY PROGRESS DAILY REPORT -->
      <iframe 
        id="frameDailyReport" 
        class="carousel-frame active" 
        src="https://niranam999.github.io/aveam-daily-assembly-dashboard/dashboard.html"
        title="Assembly Progress Daily Report">
      </iframe>

      <!-- FRAME 1: Z-LINK REALTIME DASHBOARD -->
      <iframe 
        id="frameZLink" 
        class="carousel-frame" 
        src="index.html?v=20260821_v8" 
        title="Z-Link Realtime Dashboard">
      </iframe>

    </div>
  </div>

  <!-- JAVASCRIPT SCRIPTS -->
  <script src="js/firebase-config.js?v=20260821_v8"></script>
  <script src="js/tv-carousel.js?v=20260821_v8"></script>
</body>
</html>
